unique_name: Sales Amount Prior Year
object_type: metric_calc
label: Sales Amount Prior Year
description: Sales Amount for the same period one year earlier.
expression: |-
  CASE WHEN ISEMPTY([Measures].[Sales Amount]) THEN NULL
  ELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Sales Amount])
  END
format: $#,##0.00
